<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <title>蔚蓝咖啡厅</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="rgb(35, 209, 247)">
  <meta name="description" content="蔚蓝咖啡厅 - 《蔚蓝档案》日服汉化">
  <meta name="apple-mobile-web-app-title" content="蔚蓝咖啡厅">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="蔚蓝咖啡厅">
  <meta property="og:description" content="蔚蓝咖啡厅 - 《蔚蓝档案》日服汉化">
  <meta property="og:image" content="https://bluearchive.cafe/banner.png">
  <meta property="og:url" content="https://bluearchive.cafe/">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" sizes="16x16 32x32 48x48" href="./favicon.ico">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
  <link rel="stylesheet" href="./assets/css/navbar.css">
  <link rel="stylesheet" href="./assets/css/card.css">
  <link rel="stylesheet" href="./assets/css/button.css">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <video src="./assets/videos/background.mp4" autoplay muted loop playsinline></video>

  <nav class="top">
    <a href="#docs">文档</a>
    <a href="#guide">指南</a>
    <a href="./">主页</a>
    <a href="#status">状态</a>
    <a href="#about">关于</a>
    <div class="icons">
      <a href="#docs" title="文档"><img src="./assets/icons/triangle.png"></a>
      <a href="#guide" title="指南"><img src="./assets/icons/cross.png"></a>
      <a href="#status" title="状态"><img src="./assets/icons/plus.png"></a>
      <a href="#about" title="关于"><img src="./assets/icons/circle.png"></a>
    </div>
  </nav>

  <header>
    <img class="light" src="./assets/images/light.png">
    <img class="dark" src="./assets/images/dark.png">
  </header>

  <main></main>

  <nav class="bottom">
    <a href="#docs"><img src="./assets/icons/triangle.png">文档</a>
    <a href="#guide"><img src="./assets/icons/cross.png">指南</a>
    <a href="./"><img src="./assets/icons/square.png">主页</a>
    <a href="#status"><img src="./assets/icons/plus.png">状态</a>
    <a href="#about"><img src="./assets/icons/circle.png">关于</a>
  </nav>

  <script type="module">
    import MarkdownIt from 'https://cdn.jsdelivr.net/npm/markdown-it/+esm'
    import MarkdownItGitHubAlerts from 'https://cdn.jsdelivr.net/npm/markdown-it-github-alerts/+esm'

    const markdownit = new MarkdownIt({
      html: true,
      linkify: true,
      typographer: true
    }).use(MarkdownItGitHubAlerts);

    const pages = ['docs', 'guide', 'home', 'status', 'about']
    const htmls = Object.fromEntries(await Promise.all(pages.map(async (page) => {
      return [page, markdownit.render(await (await fetch(`./md/${page}.md`)).text())]
    })))

    const main = document.querySelector('main')
    const navLinks = document.querySelectorAll('nav a')
    let renderTimer

    const getCurrentPage = () => location.hash.slice(1) || 'home'
    const getLinkPage = (link) => {
      const href = link.getAttribute('href')
      return href.startsWith('#') ? href.slice(1) : 'home'
    }

    const fillStatus = async () => {
      if (getCurrentPage() !== 'status') return

      try {
        const res = await fetch('https://api.bluearchive.cafe/status/list')
        const statusData = await res.json()
        const elements = document.querySelectorAll('[data-key]')

        elements.forEach((el) => {
          const keyPath = el.dataset.key

          if (keyPath.endsWith('/status')) {
            const type = keyPath.split('/')[0]
            const official = statusData[type]?.official?.version
            const localized = statusData[type]?.localized?.version

            if (!official || !localized) {
              el.textContent = '未获取'
              el.style.color = 'rgb(245, 180, 0)'
            } else if (official === localized) {
              el.textContent = '已同步'
              el.style.color = 'rgb(46, 204, 113)'
            } else {
              el.textContent = '未同步'
              el.style.color = 'rgb(231, 76, 60)'
            }
            return
          }

          const value = keyPath.split('/').reduce((obj, key) => obj?.[key], statusData)
          if (value !== undefined) el.textContent = value
        })
      } catch (error) {
        document.querySelectorAll('[data-key]').forEach((el) => {
          el.textContent = '获取失败'
          el.style.color = 'rgb(231, 76, 60)'
        })
      }
    }

    const render = () => {
      const page = getCurrentPage()

      clearTimeout(renderTimer)

      main.style.opacity = 0
      main.style.transform = 'translateY(50px)'

      navLinks.forEach((link) => {
        link.classList.toggle('active', getLinkPage(link) === page)
      })

      renderTimer = setTimeout(() => {
        main.innerHTML = htmls[page] || htmls.home
        main.style.opacity = 1
        main.style.transform = 'translateY(0)'
        if (page === 'status') fillStatus()
      }, 200)
    }

    window.addEventListener('hashchange', render)
    window.addEventListener('popstate', render)

    navLinks.forEach((link) => {
      link.addEventListener('click', (event) => {
        const href = link.getAttribute('href')
        const targetPage = getLinkPage(link)
        const currentPage = getCurrentPage()

        if (targetPage === currentPage) {
          event.preventDefault()
          return
        }

        event.preventDefault()
        window.scrollTo({ top: 0, left: 0, behavior: 'smooth' })

        const waitForTop = () => {
          const y = window.scrollY || document.documentElement.scrollTop
          if (!y) {
            if (targetPage === 'home') {
              history.pushState(null, '', location.pathname + location.search)
              render()
            } else {
              location.hash = href
            }
          } else {
            requestAnimationFrame(waitForTop)
          }
        }

        requestAnimationFrame(waitForTop)
      })
    })

    render()
  </script>

</body>

</html>
